[project]
name = "screen-monitor"
version = "0.1.0"
description = "Screen Red-Alert Monitoring System (initial version: camera + frame health + watchdog)"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
